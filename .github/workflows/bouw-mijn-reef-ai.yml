name: Bouw Mijn Reef AI APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Bouw APK
        run: |
          unzip -q Mijn_Reef_AI_Android_bouwpakket.zip
          cd Mijn_Reef_AI_Android_project
          gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Mijn-Reef-AI-APK
          path: Mijn_Reef_AI_Android_project/app/build/outputs/apk/debug/app-debug.apk
